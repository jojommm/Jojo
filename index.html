
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الستيكرز: غير فالصفحة الأولى -->
  <div class="sticker-rain" aria-hidden="true">
    <img class="rain-sticker sticker-a" src="3C7BC7B2-10E0-4E33-B16D-ECF56F82E248.jpeg" alt="">
    <img class="rain-sticker sticker-b" src="7BDA4F46-729E-4216-ACD8-F5F3DC3AFB7B.jpeg" alt="">
    <img class="rain-sticker sticker-c" src="C80D14D1-921F-4DDE-90E0-A716B80F5AED.jpeg" alt="">
    <img class="rain-sticker sticker-d" src="IMG_2425.jpeg" alt="">
    <img class="rain-sticker sticker-e" src="3C7BC7B2-10E0-4E33-B16D-ECF56F82E248.jpeg" alt="">
    <img class="rain-sticker sticker-b" src="C80D14D1-921F-4DDE-90E0-A716B80F5AED.jpeg" alt="">
    <img class="rain-sticker sticker-d" src="7BDA4F46-729E-4216-ACD8-F5F3DC3AFB7B.jpeg" alt="">
    <img class="rain-sticker sticker-c" src="IMG_2425.jpeg" alt="">
  </div>

  <!-- الصفحة الأولى -->
  <main id="welcome" class="page">
    <p class="tiny"></p>
    <h1><span></span></h1>
    <p class="arabic-title"></p>
    <p class="intro"></p>

    <button id="openGift" class="main-button">
      <span></span>
      <small></small>
    </button>
  </main>

  <!-- صفحة السؤال -->
  <section id="questionPage" class="page hidden">
    <div class="question-card">
      <p class="question-intro"></p>
      <p class="question-en"></p>
      <h2></h2>

      <div class="buttons">
        <button id="yesButton" class="yes">
          <span></span>
          <small></small>
        </button>

        <button id="noButton" class="no">
          <span></span>
          <small></small>
        </button>
      </div>

      <p id="noMessage" class="no-message"></p>
    </div>
  </section>

  <!-- صفحة مقدمة الهدية -->
  <section id="giftPage" class="page hidden">
    <div class="gift-card">
      <h2></h2>
      <p class="gift-english"></p>
      <p class="gift-text"></p>

      <button id="continueButton" class="main-button">
        <span></span>
        <small></small>
      </button>
    </div>
  </section>

  <!-- الهدية الحقيقية -->
  <section id="realGiftPage" class="page hidden">
    <div class="gift-content">

      <!-- الصورة الأولى: ضعي اسم الصورة فـ src -->
      <section class="gift-section">
        <img class="memory-photo" src="" alt="Our memory">
        <p class="photo-caption"></p>
      </section>

      <!-- الصورة الثانية -->
      <section class="gift-section">
        <img class="memory-photo" src="" alt="Our memory">
        <p class="photo-caption"></p>
      </section>

      <!-- الصورة الثالثة -->
      <section class="gift-section">
        <img class="memory-photo" src="" alt="Our memory">
        <p class="photo-caption"></p>
      </section>

      <!-- الفيديو -->
      <section class="gift-section video-section">
        <video class="memory-video" controls playsinline preload="metadata">
          <source src="" type="video/mp4">
        </video>
        <p class="video-caption"></p>
      </section>

      <!-- Spotify -->
      <section class="gift-section music-section">
        <iframe
          src="https://open.spotify.com/embed/playlist/05jwwu3QxZQornR5tXYuWX?utm_source=generator"
          width="100%"
          height="352"
          title="Playlist"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
        <p class="music-caption"></p>
      </section>

      <!-- زر الرسالة -->
      <section class="gift-section final-section">
        <button id="openLetterButton" class="main-button">
          <span></span>
        </button>
      </section>

    </div>
  </section>

  <!-- الرسالة الأخيرة -->
  <section id="letterPage" class="letter-page hidden">
    <div class="letter-paper">
      <h2></h2>
      <div class="letter-message"></div>
      <button id="closeLetterButton" class="main-button">
        <span></span>
      </button>
    </div>
  </section>

  <script>
    const welcome = document.getElementById("welcome");
    const questionPage = document.getElementById("questionPage");
    const giftPage = document.getElementById("giftPage");
    const realGiftPage = document.getElementById("realGiftPage");
    const letterPage = document.getElementById("letterPage");

    const openGift = document.getElementById("openGift");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");
    const noMessage = document.getElementById("noMessage");
    const continueButton = document.getElementById("continueButton");
    const openLetterButton = document.getElementById("openLetterButton");
    const closeLetterButton = document.getElementById("closeLetterButton");

    let noCount = 0;

    function showPage(pageToShow) {
      [welcome, questionPage, giftPage, realGiftPage].forEach(page => {
        page.classList.add("hidden");
      });

      pageToShow.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // الصفحة الأولى ← السؤال
    openGift.addEventListener("click", () => {
      showPage(questionPage);
    });

    // زر "لا" كيحاول يهرب
    noButton.addEventListener("click", () => {
      noCount++;

      if (noCount >= 2) {
        noButton.style.position = "fixed";

        const maxX = Math.max(10, window.innerWidth - noButton.offsetWidth - 20);
        const maxY = Math.max(10, window.innerHeight - noButton.offsetHeight - 20);

        noButton.style.left = Math.random() * maxX + "px";
        noButton.style.top = Math.random() * maxY + "px";
      }

      if (noMessage) {
        noMessage.textContent = "";
      }
    });

    // "إيه" ← مقدمة الهدية
    yesButton.addEventListener("click", () => {
      noButton.style.position = "";
      showPage(giftPage);
    });

    // مقدمة الهدية ← الهدية الحقيقية
    continueButton.addEventListener("click", () => {
      showPage(realGiftPage);
    });

    // فتح الرسالة
    openLetterButton.addEventListener("click", () => {
      letterPage.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // إغلاق الرسالة
    closeLetterButton.addEventListener("click", () => {
      letterPage.classList.add("hidden");
    });
  </script>

</body>
</html>
