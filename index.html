
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الستيكرز: الصفحة الأولى فقط -->
  <div class="sticker-rain" aria-hidden="true">
    <img class="rain-sticker s1" src="3C7BC7B2-10E0-4E33-B16D-ECF56F82E248.jpeg" alt="">
    <img class="rain-sticker s2" src="7BDA4F46-729E-4216-ACD8-F5F3DC3AFB7B.jpeg" alt="">
    <img class="rain-sticker s3" src="C80D14D1-921F-4DDE-90E0-A716B80F5AED.jpeg" alt="">
    <img class="rain-sticker s4" src="IMG_2425.jpeg" alt="">
    <img class="rain-sticker s5" src="3C7BC7B2-10E0-4E33-B16D-ECF56F82E248.jpeg" alt="">
    <img class="rain-sticker s6" src="C80D14D1-921F-4DDE-90E0-A716B80F5AED.jpeg" alt="">
    <img class="rain-sticker s7" src="7BDA4F46-729E-4216-ACD8-F5F3DC3AFB7B.jpeg" alt="">
    <img class="rain-sticker s8" src="IMG_2425.jpeg" alt="">
  </div>

  <!-- 1: WELCOME -->
  <main id="welcome" class="page">
    <p class="tiny"><!-- كتبي هنا إلا بغيتي --></p>
    <h1><!-- العنوان ديالك --></h1>
    <p class="arabic-title"><!-- النص ديالك --></p>
    <p class="intro"><!-- المقدمة ديالك --></p>

    <button id="openGift" class="main-button">
      <span><!-- نص الزر --></span>
      <small></small>
    </button>
  </main>

  <!-- 2: QUESTION -->
  <section id="questionPage" class="page hidden">
    <div class="question-card">
      <p class="question-intro"><!-- مقدمة السؤال --></p>
      <p class="question-en"><!-- النص بالإنجليزية اختياري --></p>
      <h2><!-- السؤال: بتحبني ولا لا؟ --></h2>

      <div class="buttons">
        <button id="yesButton" class="yes">
          <span><!-- نص إيه --></span>
          <small></small>
        </button>

        <button id="noButton" class="no">
          <span><!-- نص لا --></span>
          <small></small>
        </button>
      </div>

      <p id="noMessage" class="no-message"></p>
    </div>
  </section>

  <!-- 3: GIFT INTRO -->
  <section id="giftPage" class="page hidden">
    <div class="gift-card">
      <h2><!-- عنوان مقدمة الهدية --></h2>
      <p class="gift-english"><!-- نص بالإنجليزية اختياري --></p>
      <p class="gift-text"><!-- كلامك هنا --></p>

      <button id="continueButton" class="main-button">
        <span><!-- نص زر الاستمرار --></span>
        <small></small>
      </button>
    </div>
  </section>

  <!-- 4: REAL GIFT -->
  <section id="realGiftPage" class="page hidden">
    <div class="gift-content">

      <!-- الصورة الأولى -->
      <section class="gift-section">
        <img class="memory-photo" src="" alt="Memory one">
        <p class="photo-caption"><!-- تعليق الصورة الأولى --></p>
      </section>

      <!-- الصورة الثانية -->
      <section class="gift-section">
        <img class="memory-photo" src="" alt="Memory two">
        <p class="photo-caption"><!-- تعليق الصورة الثانية --></p>
      </section>

      <!-- الصورة الثالثة -->
      <section class="gift-section">
        <img class="memory-photo" src="" alt="Memory three">
        <p class="photo-caption"><!-- تعليق الصورة الثالثة --></p>
      </section>

      <!-- الفيديو: زيدي اسم الفيديو فـ src -->
      <section class="gift-section video-section">
        <video class="memory-video" controls playsinline preload="metadata">
          <source src="" type="video/mp4">
        </video>
        <p class="video-caption"><!-- تعليق الفيديو --></p>
      </section>

      <!-- Spotify playlist -->
      <section class="gift-section music-section">
        <iframe
          src="https://open.spotify.com/embed/playlist/05jwwu3QxZQornR5tXYuWX?utm_source=generator"
          title="Spotify playlist"
          width="100%"
          height="352"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
        <p class="music-caption"><!-- تعليق الموسيقى --></p>
      </section>

      <!-- زر فتح الرسالة -->
      <section class="gift-section final-section">
        <button id="openLetterButton" class="main-button">
          <span><!-- نص فتح الرسالة --></span>
        </button>
      </section>

    </div>
  </section>

  <!-- 5: LETTER -->
  <section id="letterPage" class="letter-page hidden">
    <div class="letter-paper">
      <h2><!-- عنوان الرسالة --></h2>
      <div class="letter-message"><!-- رسالتك لمُراد --></div>

      <button id="closeLetterButton" class="main-button">
        <span><!-- نص إغلاق الرسالة --></span>
      </button>
    </div>
  </section>

  <script>
    const welcome = document.getElementById("welcome");
    const questionPage = document.getElementById("questionPage");
    const giftPage = document.getElementById("giftPage");
    const realGiftPage = document.getElementById("realGiftPage");
    const letterPage = document.getElementById("letterPage");

    const openGift = document.getElementById("openGift");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");
    const continueButton = document.getElementById("continueButton");
    const openLetterButton = document.getElementById("openLetterButton");
    const closeLetterButton = document.getElementById("closeLetterButton");

    let noCount = 0;

    function showPage(nextPage) {
      [welcome, questionPage, giftPage, realGiftPage].forEach(page => {
        page.classList.add("hidden");
      });

      nextPage.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    openGift.addEventListener("click", () => {
      showPage(questionPage);
    });

    noButton.addEventListener("click", () => {
      noCount++;

      if (noCount >= 2) {
        noButton.style.position = "fixed";

        const maxX = Math.max(0, window.innerWidth - noButton.offsetWidth);
        const maxY = Math.max(0, window.innerHeight - noButton.offsetHeight);

        noButton.style.left = Math.random() * maxX + "px";
        noButton.style.top = Math.random() * maxY + "px";
      }
    });

    yesButton.addEventListener("click", () => {
      noButton.style.position = "";
      noButton.style.left = "";
      noButton.style.top = "";
      showPage(giftPage);
    });

    continueButton.addEventListener("click", () => {
      showPage(realGiftPage);
    });

    openLetterButton.addEventListener("click", () => {
      letterPage.classList.remove("hidden");
      document.body.style.overflow = "hidden";
    });

    closeLetterButton.addEventListener("click", () => {
      letterPage.classList.add("hidden");
      document.body.style.overflow = "";
    });
  </script>

</body>
</html>
